name: Sales Forecast Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn xgboost mlflow joblib

      - name: Register dataset
        run: python sales_forecast/model_building/data_register.py

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Prepare train and test data
        run: python sales_forecast/model_building/prep.py

      - name: Upload train-test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn xgboost mlflow joblib

      - name: Download train-test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: .

      - name: Start MLflow tracking server
        run: |
          nohup mlflow ui --host 127.0.0.1 --port 5000 > mlflow.log 2>&1 &
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null; then
              echo "MLflow server is ready."
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/health

      - name: Train model
        run: python sales_forecast/model_building/train.py

      - name: Verify trained model
        run: |
          ls -lh sales_forecast/deployment/
          test -s sales_forecast/deployment/best_sales_revenue_model_v1.joblib

      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f sales_forecast/deployment/best_sales_revenue_model_v1.joblib

          if ! git diff --cached --quiet; then
            git commit -m "Update trained sales model [skip ci]"
            git push origin HEAD:main
          else
            echo "The model file is unchanged."
          fi
